name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: frontend
            path: frontend
            command: npm run typecheck
          - package: simulation
            path: simulation
            command: npm run typecheck
          - package: agents
            path: agents
            command: npm run typecheck
          - package: shared
            path: shared
            command: npm run typecheck
          - package: backend
            path: backend
            command: ruff check
          - package: backend
            path: backend
            command: mypy .

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: simulation
            path: simulation
            command: npm test
          - package: agents
            path: agents
            command: npm test
          - package: shared
            path: shared
            command: npm test

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          tags: eidolon:latest